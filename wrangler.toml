name = "openworld-private"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[[ratelimits]]
name = "LOGIN_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "LOGIN_GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 100, period = 60 }
